services:
  - type: web
    name: dlp-server
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt && (curl -fsSL https://nodejs.org/dist/v20.11.1/node-v20.11.1-linux-x64.tar.xz -o /tmp/node.tar.xz && tar -xf /tmp/node.tar.xz -C /opt && ln -sf /opt/node-v20.11.1-linux-x64/bin/node /usr/local/bin/node || echo "node install skipped")
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: AUTH_TOKEN
        value: "dlp_secret_2024"
    healthCheckPath: /
